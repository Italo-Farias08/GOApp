<style>
  :root {
    --bg: #0B0B0F;
    --surface: #16161D;
    --surface-alt: #1F1F29;
    --border: #2A2A35;
    --primary: #39FF6A;
    --primary-pressed: #2ED95C;
    --primary-dim: rgba(57, 255, 106, 0.12);
    --text: #F5F5F7;
    --text-secondary: #9A9AA5;
    --text-muted: #5C5C66;
    --danger: #FF4D4D;
    --danger-dim: rgba(255, 77, 77, 0.12);
    --warning: #FFB020;
    --warning-dim: rgba(255, 176, 32, 0.12);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background:
      radial-gradient(1100px 500px at 12% -10%, rgba(57,255,106,0.07), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(57,255,106,0.05), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  header {
    padding: 24px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    position: sticky;
    top: 0;
    background: rgba(11, 11, 15, 0.85);
    backdrop-filter: blur(10px);
    z-index: 10;
  }

  .marca {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .marca img {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    display: block;
  }

  .marca .titulos {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .marca .selo {
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--primary);
    font-weight: 700;
    text-transform: uppercase;
  }

  h1 {
    font-size: 17px;
    margin: 0;
    font-weight: 600;
    color: var(--text-secondary);
  }

  .config {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .config input {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 13px;
    border-radius: 10px;
    font-size: 13px;
    width: 280px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    transition: border-color 0.15s;
  }

  .config input::placeholder { color: var(--text-muted); }
  .config input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-dim); }

  button {
    font-family: inherit;
    border: none;
    cursor: pointer;
  }

  .btn {
    background: var(--surface-alt);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 9px 16px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    transition: border-color 0.15s, transform 0.1s;
  }

  .btn:hover { border-color: var(--primary); }
  .btn:active { transform: scale(0.97); }

  .btn-primario {
    background: var(--primary);
    color: #05130A;
    border: 1px solid var(--primary);
  }

  .btn-primario:hover { background: var(--primary-pressed); border-color: var(--primary-pressed); }

  main {
    max-width: 880px;
    margin: 0 auto;
    padding: 28px 24px 60px;
  }

  .barra-status {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    color: var(--text-secondary);
    font-size: 13px;
  }

  .barra-status .contagem {
    color: var(--text);
    font-weight: 700;
    font-size: 16px;
  }

  .barra-status .pinga {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--primary);
    margin-right: 7px;
    box-shadow: 0 0 8px var(--primary);
    vertical-align: middle;
  }

  .lista { display: flex; flex-direction: column; gap: 10px; }

  .pedido {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    transition: border-color 0.15s, transform 0.12s;
  }

  .pedido:hover { border-color: #383843; }

  .pedido .esquerda {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
  }

  .avatar {
    flex-shrink: 0;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--primary-dim);
    color: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 15px;
  }

  .pedido .info { min-width: 0; }

  .pedido .nome {
    font-weight: 600;
    font-size: 15px;
    margin: 0 0 5px;
    color: var(--text);
  }

  .pedido .detalhes {
    color: var(--text-secondary);
    font-size: 12.5px;
    display: flex;
    flex-wrap: wrap;
    gap: 5px 12px;
  }

  .pedido .detalhes span { white-space: nowrap; display: flex; align-items: center; gap: 4px; }

  .pedido .cpf {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  .pedido .valor-bloco {
    text-align: right;
    flex-shrink: 0;
  }

  .pedido .valor {
    font-size: 21px;
    font-weight: 800;
    color: var(--warning);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .pedido .marcar {
    margin-top: 9px;
    background: var(--primary-dim);
    color: var(--primary);
    padding: 7px 14px;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 700;
    transition: background 0.15s, transform 0.1s;
  }

  .pedido .marcar:hover { background: var(--primary); color: #05130A; }
  .pedido .marcar:active { transform: scale(0.96); }
  .pedido .marcar:disabled { opacity: 0.5; cursor: default; background: var(--primary-dim); color: var(--primary); }

  .vazio, .erro, .carregando {
    text-align: center;
    padding: 70px 20px;
    color: var(--text-secondary);
    font-size: 14px;
    border: 1px dashed var(--border);
    border-radius: 14px;
  }

  .vazio .emoji, .carregando .emoji { font-size: 30px; display: block; margin-bottom: 10px; }

  .erro {
    color: var(--danger);
    border: 1px solid var(--danger-dim);
    background: var(--danger-dim);
  }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(12px);
    background: var(--surface-alt);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 11px 20px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }

  .toast.visivel {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @media (max-width: 640px) {
    header { padding: 18px 18px; }
    .config input { width: 170px; }
    .pedido { flex-direction: column; align-items: flex-start; gap: 14px; }
    .valor-bloco { text-align: left; width: 100%; }
    .pedido .marcar { width: 100%; text-align: center; }
  }
</style>
</head>
<body>

    <div class="titulos">
      <span class="selo">#GO</span>
      <h1>Pedidos de saque</h1>
    </div>
  </div>
  <div class="config">
    <input id="urlBase" type="text" placeholder="URL do backend, ex: https://seu-app.up.railway.app" />
    <button class="btn" id="btnSalvarUrl">Salvar</button>
    <button class="btn btn-primario" id="btnAtualizar">Atualizar</button>
  </div>
</header>

<main>
  <div class="barra-status">
    <span id="contagemTexto">—</span>
    <span id="ultimaAtualizacao"></span>
  </div>
  <div class="lista" id="lista">
    <div class="carregando"><span class="emoji">⚙️</span>Configure a URL do backend acima pra começar.</div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
  const CHAVE_URL = 'goapp-production-1057.up.railway.app';
  const campoUrl = document.getElementById('urlBase');
  const lista = document.getElementById('lista');
  const contagemTexto = document.getElementById('contagemTexto');
  const ultimaAtualizacao = document.getElementById('ultimaAtualizacao');
  const toast = document.getElementById('toast');

  let atualizando = false;

  campoUrl.value = localStorage.getItem(CHAVE_URL) || '';

  document.getElementById('btnSalvarUrl').addEventListener('click', () => {
    salvarUrl();
    carregarPedidos();
  });
  document.getElementById('btnAtualizar').addEventListener('click', carregarPedidos);

  campoUrl.addEventListener('keydown', (evento) => {
    if (evento.key === 'Enter') {
      salvarUrl();
      carregarPedidos();
    }
  });

  function salvarUrl() {
    const valor = campoUrl.value.trim().replace(/\/+$/, '');
    localStorage.setItem(CHAVE_URL, valor);
    mostrarToast('URL salva.');
  }

  function obterUrlBase() {
    return (localStorage.getItem(CHAVE_URL) || campoUrl.value.trim()).replace(/\/+$/, '');
  }

  function mostrarToast(mensagem) {
    toast.textContent = mensagem;
    toast.classList.add('visivel');
    setTimeout(() => toast.classList.remove('visivel'), 2200);
  }

  function formatarMoeda(valor) {
    return Number(valor).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  }

  function formatarQuando(iso) {
    try {
      return new Date(iso).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
    } catch {
      return iso;
    }
  }

  function iniciais(nome) {
    if (!nome) return '?';
    const partes = nome.trim().split(/\s+/);
    const primeira = partes[0]?.[0] || '';
    const ultima = partes.length > 1 ? partes[partes.length - 1][0] : '';
    return (primeira + ultima).toUpperCase();
  }

  async function carregarPedidos() {
    const base = obterUrlBase();
    if (!base) {
      lista.innerHTML = '<div class="carregando"><span class="emoji">⚙️</span>Configure a URL do backend acima pra começar.</div>';
      contagemTexto.textContent = '—';
      return;
    }
    if (atualizando) return;
    atualizando = true;

    lista.innerHTML = '<div class="carregando"><span class="emoji">⏳</span>Carregando pedidos…</div>';

    try {
      const resposta = await fetch(`${base}/payouts/admin/pendentes`);
      if (!resposta.ok) throw new Error(`O backend respondeu ${resposta.status}`);
      const pedidos = await resposta.json();
      renderizarPedidos(pedidos);
      ultimaAtualizacao.textContent = `Atualizado às ${new Date().toLocaleTimeString('pt-BR')}`;
    } catch (erro) {
      lista.innerHTML = `<div class="erro">Não deu pra carregar: ${erro.message}. Confira a URL e se o backend está no ar.</div>`;
      contagemTexto.textContent = '—';
    } finally {
      atualizando = false;
    }
  }

  function renderizarPedidos(pedidos) {
    if (!pedidos.length) {
      contagemTexto.innerHTML = '<span class="contagem">Nenhum pedido pendente</span>';
      lista.innerHTML = '<div class="vazio"><span class="emoji">✅</span>Tudo pago — nenhum saque esperando agora.</div>';
      return;
    }

    contagemTexto.innerHTML = `<span class="pinga"></span><span class="contagem">${pedidos.length}</span> pedido${pedidos.length > 1 ? 's' : ''} pendente${pedidos.length > 1 ? 's' : ''}`;

    lista.innerHTML = '';
    pedidos.forEach((pedido) => {
      const item = document.createElement('div');
      item.className = 'pedido';
      item.innerHTML = `
        <div class="esquerda">
          <div class="avatar">${escaparHtml(iniciais(pedido.motoristaNome))}</div>
          <div class="info">
            <p class="nome">${escaparHtml(pedido.motoristaNome || 'Motorista')}</p>
            <div class="detalhes">
              <span>${escaparHtml(pedido.motoristaTelefone || 'sem telefone')}</span>
              <span class="cpf">CPF ${formatarCpf(pedido.cpf)}</span>
              <span>${formatarQuando(pedido.criadoEm)}</span>
            </div>
          </div>
        </div>
        <div class="valor-bloco">
          <div class="valor">${formatarMoeda(pedido.valor)}</div>
          <button class="marcar" data-id="${pedido.id}">Marcar como pago</button>
        </div>
      `;
      lista.appendChild(item);
    });

    lista.querySelectorAll('.marcar').forEach((botao) => {
      botao.addEventListener('click', () => marcarComoPago(botao.dataset.id, botao));
    });
  }

  async function marcarComoPago(id, botao) {
    const base = obterUrlBase();
    botao.disabled = true;
    botao.textContent = 'Marcando…';
    try {
      const resposta = await fetch(`${base}/payouts/admin/${id}/pago`, { method: 'POST' });
      if (!resposta.ok) throw new Error(`O backend respondeu ${resposta.status}`);
      mostrarToast('Pedido marcado como pago.');
      carregarPedidos();
    } catch (erro) {
      mostrarToast(`Não deu: ${erro.message}`);
      botao.disabled = false;
      botao.textContent = 'Marcar como pago';
    }
  }

  function formatarCpf(cpf) {
    if (!cpf || cpf.length !== 11) return cpf || '';
    return cpf.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
  }

  function escaparHtml(texto) {
    const div = document.createElement('div');
    div.textContent = texto;
    return div.innerHTML;
  }

  if (campoUrl.value) carregarPedidos();

  setInterval(() => { if (obterUrlBase()) carregarPedidos(); }, 30000);
</script>

</body>
</html>
